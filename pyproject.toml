[project]
name = "sociaboss-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
# Espejo exacto de requirements.txt: Vercel exige una tabla [project] en
# cuanto existe pyproject.toml ("uv lock" falla si no la encuentra), y una
# vez que la agrega usa este archivo (no requirements.txt) para resolver
# dependencias.
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
    "sqlalchemy==2.0.28",
    "psycopg2-binary==2.9.12",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    "google-api-python-client==2.122.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "bcrypt==5.0.0",
    "reportlab==5.0.1",
    "anthropic==1.1.0",
]
